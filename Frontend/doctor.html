<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Panel</title>
    <link rel="stylesheet" href="css/doctor.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h3>MediCare</h3>
            <p class="panel-sub">Doctor Portal</p>
            <a href="doctor.html" class="active">Appointments</a>
            <a href="index.html" class="logout">Logout</a>
        </aside>
        <main class="content">
            <h2>Doctor Schedule Dashboard</h2>
            <div class="card">
                <h3>Patient Appointments Queue</h3>
                <table class="simple-table">
                    <thead>
                        <tr>
                            <th>Patient Identifier</th>
                            <th>Scheduled Time</th>
                            <th>Reason/Type</th>
                        </tr>
                    </thead>
                    <tbody id="docApptsBody"></tbody>
                </table>
            </div>
            <div class="card form-box">
                <h3>Add Diagnosis Report</h3>
                <form id="recordForm">
                    <div class="form-group">
                        <label for="pId">Patient ID</label>
                        <input type="number" id="pId" required placeholder="e.g. 5">
                    </div>
                    <div class="form-group">
                        <label for="diag">Diagnosis Details & Clinical Findings</label>
                        <textarea id="diag" rows="4" required placeholder="Write clinical diagnosis findings here..."></textarea>
                    </div>
                    <button type="submit" class="btn">Submit Medical Report</button>
                </form>
            </div>
        </main>
    </div>
    <script src="services/appointmentService.js"></script>
    <script src="services/medicalRecordService.js"></script>
    <script src="js/doctor.js"></script>
</body>
</html>
