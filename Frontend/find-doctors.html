<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient - Find Doctors</title>
    <link rel="stylesheet" href="css/find-doctors.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h3>MediCare</h3>
            <a href="patient-overview.html">Overview</a>
            <a href="find-doctors.html" class="active">Find Doctors</a>
            <a href="medical-records.html">Medical Records</a>
            <a href="payments.html">Payments</a>
            <a href="index.html" class="logout">Logout</a>
        </aside>
        <main class="content">
            <h2>Our Specialists</h2>
            <div id="doctorsGrid" class="row-layout"></div>
            <div class="card form-box">
                <h3>Quick Reservation Form</h3>
                <form id="bookForm">
                    <div class="form-group">
                        <label for="docIdInput">Enter Doctor ID to Book</label>
                        <input type="number" id="docIdInput" required placeholder="e.g. 1">
                    </div>
                    <div class="form-group">
                        <label for="bookingDate">Choose Date</label>
                        <input type="date" id="bookingDate" required>
                    </div>
                    <div class="form-group">
                        <label for="bookingTime">Choose Time</label>
                        <input type="time" id="bookingTime" required>
                    </div>
                    <button type="submit" class="btn">Confirm Booking</button>
                </form>
            </div>
        </main>
    </div>
    <script src="services/doctorService.js"></script>
    <script src="services/appointmentService.js"></script>
    <script src="js/find-doctors.js"></script>
</body>
</html>
