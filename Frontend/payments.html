<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient - Payments</title>
    <link rel="stylesheet" href="css/payments.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h3>MediCare</h3>
            <a href="patient-overview.html">Overview</a>
            <a href="find-doctors.html">Find Doctors</a>
            <a href="medical-records.html">Medical Records</a>
            <a href="payments.html" class="active">Payments</a>
            <a href="index.html" class="logout">Logout</a>
        </aside>
        <main class="content">
            <h2>Invoices & Financial Balance</h2>
            <div class="card invoice-card">
                <p>CURRENT OUTSTANDING STATEMENT BALANCE</p>
                <h1 id="balanceAmount">$150.00 <span id="paymentStatus" class="badge-pending">PENDING</span></h1>
            </div>
            <div class="card form-box" id="paymentFormContainer">
                <h3>Secure Payment Gateway</h3>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="cardName">Cardholder Name</label>
                        <input type="text" id="cardName" required placeholder="Sarah Johnson">
                    </div>
                    <div class="form-group">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" required placeholder="•••• •••• •••• 4412" maxlength="19">
                    </div>
                    <div class="row-fields">
                        <div class="form-group half-width">
                            <label for="expDate">Expiry Date</label>
                            <input type="text" id="expDate" required placeholder="MM/YY" maxlength="5">
                        </div>
                        <div class="form-group half-width">
                            <label for="cvv">CVV</label>
                            <input type="password" id="cvv" required placeholder="•••" maxlength="3">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-pay">Pay Invoice Now</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/payments.js"></script>
</body>
</html>
