<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Sign Up</title>
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <h2>Create Portal Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="regRole">Register As</label>
                    <select id="regRole" required>
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p class="switch-auth">Already have an account? <a href="index.html">Sign In</a></p>
        </div>
    </div>
    <script src="services/patientService.js"></script>
    <script src="services/doctorService.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
